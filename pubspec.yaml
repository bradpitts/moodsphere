name: moodsphere
description: "MoodSphere - An offline-first mood journaling Flutter mobile app with 3D Galaxy Sphere and Polish."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  webview_flutter: ^4.7.0
  local_auth: ^2.2.0
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.1.0
  table_calendar: ^3.1.0
  archive: ^3.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/three_sphere.html
