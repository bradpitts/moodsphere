<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MoodSphere 3D Galaxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #121212; font-family: sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; touch-action: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    // --- THREE.JS SCENE SETUP ---
    let scene, camera, renderer;
    let sphereCore, wireframeCore;
    let beadsGroup;
    let beadsList = [];

    // Camera & Interaction parameters
    let targetRotationX = 0, targetRotationY = 0;
    let currentRotationX = 0, currentRotationY = 0;
    let isDragging = false;
    let previousTouchX = 0, previousTouchY = 0;
    let cameraDistance = 7.5;
    let targetCameraDistance = 7.5;

    // Raycaster for click/tap selection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function init() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      // 1. Scene
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x121212, 0.04);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
      camera.position.z = cameraDistance;

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      // 4. Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight1.position.set(5, 10, 7);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x7c3aed, 0.8);
      dirLight2.position.set(-5, -10, -7);
      scene.add(dirLight2);

      // 5. Central 3D Wireframe Glass Sphere
      const sphereRadius = 3.0;

      // Inner subtle glass core
      const coreGeo = new THREE.SphereGeometry(sphereRadius * 0.96, 32, 32);
      const coreMat = new THREE.MeshPhysicalMaterial({
        color: 0x1e1e2c,
        transparent: true,
        opacity: 0.35,
        roughness: 0.1,
        metalness: 0.1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
      });
      sphereCore = new THREE.Mesh(coreGeo, coreMat);
      scene.add(sphereCore);

      // Outer glowing wireframe mesh
      const wireGeo = new THREE.IcosahedronGeometry(sphereRadius, 3);
      const wireMat = new THREE.MeshBasicMaterial({
        color: 0x475569,
        wireframe: true,
        transparent: true,
        opacity: 0.2,
      });
      wireframeCore = new THREE.Mesh(wireGeo, wireMat);
      scene.add(wireframeCore);

      // 6. Ambient Stars Background
      createBackgroundParticles();

      // 7. Group for Mood Beads
      beadsGroup = new THREE.Group();
      scene.add(beadsGroup);

      // Event Listeners for Interaction
      window.addEventListener('resize', onWindowResize, false);
      setupInteractions(container);

      // Start Render Loop
      animate();
    }

    function createBackgroundParticles() {
      const particleCount = 200;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 40;
        positions[i + 1] = (Math.random() - 0.5) * 40;
        positions[i + 2] = (Math.random() - 0.5) * 40;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.12,
        transparent: true,
        opacity: 0.3,
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);
    }

    // --- FIBONACCI SPIRAL BEAD DISTRIBUTION ---
    window.updateBeads = function(entriesJson) {
      // Clear existing beads
      while (beadsGroup.children.length > 0) {
        const child = beadsGroup.children[0];
        beadsGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }
      beadsList = [];

      let entries = [];
      try {
        entries = typeof entriesJson === 'string' ? JSON.parse(entriesJson) : entriesJson;
      } catch (e) {
        console.error('Failed to parse entries JSON:', e);
        return;
      }

      if (!entries || entries.length === 0) return;

      const N = entries.length;
      const sphereRadius = 3.0;
      const goldenRatio = (1 + Math.sqrt(5)) / 2;

      entries.forEach((entry, i) => {
        // Fibonacci sphere point positioning
        const y = 1 - (i / Math.max(1, N - 1)) * 2;
        const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = 2 * Math.PI * i / goldenRatio;

        const x = Math.cos(theta) * radiusAtY;
        const z = Math.sin(theta) * radiusAtY;

        const pos = new THREE.Vector3(x, y, z).multiplyScalar(sphereRadius);

        // Bead Mesh Creation
        const beadGeo = new THREE.SphereGeometry(0.28, 24, 24);
        const beadColor = new THREE.Color(entry.color || '#FFD700');

        const beadMat = new THREE.MeshStandardMaterial({
          color: beadColor,
          emissive: beadColor,
          emissiveIntensity: 0.75,
          roughness: 0.2,
          metalness: 0.5,
        });

        const beadMesh = new THREE.Mesh(beadGeo, beadMat);
        beadMesh.position.copy(pos);
        beadMesh.userData = { id: entry.id, date: entry.date, note: entry.note };

        // Glowing Outer Halo for Bead
        const haloGeo = new THREE.SphereGeometry(0.38, 16, 16);
        const haloMat = new THREE.MeshBasicMaterial({
          color: beadColor,
          transparent: true,
          opacity: 0.25,
        });
        const haloMesh = new THREE.Mesh(haloGeo, haloMat);
        beadMesh.add(haloMesh);

        beadsGroup.add(beadMesh);
        beadsList.push(beadMesh);
      });
    };

    // --- INTERACTION & TOUCH HANDLERS ---
    function setupInteractions(container) {
      let startX = 0, startY = 0;
      let hasMoved = false;

      container.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        previousTouchX = e.clientX;
        previousTouchY = e.clientY;
        hasMoved = false;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;

        const deltaX = e.clientX - previousTouchX;
        const deltaY = e.clientY - previousTouchY;

        if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
          hasMoved = true;
        }

        targetRotationY += deltaX * 0.008;
        targetRotationX += deltaY * 0.008;

        previousTouchX = e.clientX;
        previousTouchY = e.clientY;
      });

      window.addEventListener('pointerup', (e) => {
        if (isDragging && !hasMoved) {
          handleTap(e.clientX, e.clientY);
        }
        isDragging = false;
      });

      container.addEventListener('wheel', (e) => {
        targetCameraDistance += e.deltaY * 0.005;
        targetCameraDistance = Math.max(4.5, Math.min(12.0, targetCameraDistance));
      }, { passive: true });
    }

    function handleTap(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(beadsList, false);

      if (intersects.length > 0) {
        const tappedBead = intersects[0].object;
        const entryId = tappedBead.userData.id;
        
        // Pulse animation on tap
        tappedBead.scale.set(1.4, 1.4, 1.4);
        setTimeout(() => tappedBead.scale.set(1.0, 1.0, 1.0), 200);

        // Notify Flutter via JavaScript Channel
        if (window.MoodSphereChannel) {
          window.MoodSphereChannel.postMessage(entryId);
        } else if (window.FlutterChannel) {
          window.FlutterChannel.postMessage(entryId);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Smooth rotation dampening / auto-rotate when idle
      if (!isDragging) {
        targetRotationY += 0.0025;
      }

      currentRotationX += (targetRotationX - currentRotationX) * 0.08;
      currentRotationY += (targetRotationY - currentRotationY) * 0.08;

      // Rotate central sphere & beads
      if (wireframeCore) {
        wireframeCore.rotation.x = currentRotationX;
        wireframeCore.rotation.y = currentRotationY;
      }
      if (sphereCore) {
        sphereCore.rotation.x = currentRotationX * 0.5;
        sphereCore.rotation.y = currentRotationY * 0.5;
      }
      if (beadsGroup) {
        beadsGroup.rotation.x = currentRotationX;
        beadsGroup.rotation.y = currentRotationY;
      }

      // Smooth camera zoom
      camera.position.z += (targetCameraDistance - camera.position.z) * 0.1;

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
